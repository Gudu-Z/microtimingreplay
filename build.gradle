plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file('src/main/resources/microtimingreplay.accesswidener')
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

// Optional real-mod compatibility runtime, never included in the published jar.
def subtickCompatMods = providers.gradleProperty('subtickCompatMods')
def subtickCompatJars = files()
if (subtickCompatMods.isPresent()) {
	subtickCompatJars.from(fileTree(dir: subtickCompatMods.get(), includes: [
		'subtick-*.jar', '*fabric-carpet-*.jar', '*malilib-*.jar'
	]))
	// Let Loader remap the original distribution jars in the test runtime. This
	// also supports mods built with a newer Loom without changing their metadata.
	tasks.named('generateRemapClasspath').configure {
		remapClasspath.from(subtickCompatJars)
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation 'org.mockito:mockito-core:5.20.0'

}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	systemProperty 'mtr.test.subtick', subtickCompatMods.isPresent()
	if (subtickCompatMods.isPresent()) {
		// Runtime remapping reads Minecraft plus the optional mod class hierarchy.
		maxHeapSize = '2G'
		def remapClasspathTask = tasks.named('generateRemapClasspath')
		dependsOn remapClasspathTask
		inputs.files(subtickCompatJars).withPropertyName('subtickCompatJars')
		inputs.file(remapClasspathTask.flatMap { it.remapClasspathFile })
				.withPropertyName('subtickRemapClasspath')
		doFirst {
			systemProperty 'fabric.addMods', subtickCompatJars.files
					.collect { it.absolutePath }.sort().join(File.pathSeparator)
			systemProperty 'fabric.remapClasspathFile',
					remapClasspathTask.get().remapClasspathFile.get().asFile.absolutePath
		}
	}
	workingDir = layout.buildDirectory.dir("test-runs/${name}").get().asFile
	doFirst {
		workingDir.mkdirs()
	}
}

test {
	systemProperty 'fabric.side', 'server'
}

tasks.register('clientTest', Test) {
	description = 'Checks client mixins and serialization in the Fabric test runtime.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'fabric.side', 'client'
}

check.dependsOn tasks.named('clientTest')

processResources {
	filteringCharset = 'UTF-8'
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
