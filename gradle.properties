# Done to increase the memory available to gradle.
# Java 21 reads Windows argument files in the native encoding. Keep Gradle's
# argument-file writer consistent so Fabric tests work in non-ASCII project paths.
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=COMPAT
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.10
loader_version=0.19.2
loom_version=1.11.8

# Mod Properties
mod_version=1.0.1+mc1.21.10
maven_group=ml.mypals.microtimingreplay

# Dependencies
fabric_api_version=0.138.4+1.21.10
